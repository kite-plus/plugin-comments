name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # A zip whose plugin.yaml says another version would install as that
      # version.
      - name: Check the tag against plugin.yaml
        run: |
          version=$(sed -n 's/^version: //p' plugin.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but plugin.yaml says $version."
            exit 1
          fi

      - name: Pack the plugin
        run: make zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
